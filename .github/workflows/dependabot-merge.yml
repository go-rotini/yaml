# Merges a grouped minor or patch Dependabot update once CI passes on it.
name: Dependabot merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  merge:
    permissions:
      contents: read
      pull-requests: read
    uses: go-rotini/.github/.github/workflows/dependabot-merge.yml@main
    secrets: inherit
