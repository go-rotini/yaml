name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: go-rotini/.github/.github/workflows/go-ci.yml@main
    with:
      jobs: |
        - name: test
          run: |
            make clone-test-suite
            make test
          artifact: test.out
        # Line endings, paths and file handling differ by OS; the conformance suites run on Linux.
        - name: test-os
          os: [macos-latest, windows-latest]
          lf: true
          run: |
            go test -count=1 ./...
            go test -race -count=1 ./...
        - name: acceptance
          run: make test-acceptance
        - name: lint
          run: |
            make lint
            GOOS=linux GOARCH=386 go vet ./...
            GOOS=linux GOARCH=arm go vet ./...
        - name: fuzz
          run: make test-fuzz
        - name: conformance
          run: |
            make clone-test-suite
            make test-conformance
        - name: benchmark
          run: make test-bench
          artifact: test_bench.out
        - name: race
          run: make test-race
